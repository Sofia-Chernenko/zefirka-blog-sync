name: Посты из Telegram в блог

on:
  schedule:
    - cron: '*/10 * * * *'   # каждые 10 минут (GitHub иногда запускает с опозданием)
  workflow_dispatch:          # кнопка «запустить вручную»

permissions:
  contents: write

concurrency:
  group: tg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Перенос постов
        env:
          TG_CHANNEL: zimovkivlete
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python sync.py
      - name: Сохранить список постов
        run: |
          git config user.name "blog-sync"
          git config user.email "blog-sync@users.noreply.github.com"
          git add data
          # раз в день коммитится отметка last-run — так GitHub видит, что проект живой
          git diff --cached --quiet || (git commit -m "Обновление постов блога" && git push)
